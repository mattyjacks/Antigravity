<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matty Jacks CameraMod1 - Output Stream Projector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #000;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #projectorImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .watermark-hint {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-family: monospace;
      font-size: 10px;
      color: rgba(0, 255, 102, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="projectorImg" alt="Live Output Stream" />
  <div class="watermark-hint">MATTY JACKS • CAMERAMOD 1 OUTPUT</div>

  <script>
    const img = document.getElementById('projectorImg');
    const channel = new BroadcastChannel('mattyjacks_stream');

    channel.onmessage = (event) => {
      if (event.data && event.data.type === 'frame' && event.data.dataUrl) {
        img.src = event.data.dataUrl;
      }
    };
  </script>
</body>
</html>
