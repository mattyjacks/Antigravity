[package]
name = "cameramod1"
version = "0.1.0"
description = "Matty Jacks CameraMod1 - Virtual Camera Studio"
authors = ["Matty Jacks"]
edition = "2021"

[lib]
name = "cameramod1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
