<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#001a0a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="12" />
  
  <!-- Camera Lens Outer Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neonGrad)" stroke-width="16" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="100" fill="#0f172a" stroke="#00ff66" stroke-width="4"/>
  
  <!-- MJ Matrix Glyphs Overlay -->
  <text x="256" y="275" font-family="monospace, sans-serif" font-weight="900" font-size="76" fill="#00ff66" text-anchor="middle" letter-spacing="2">MJ</text>
  
  <!-- Digital Rain Nodes -->
  <circle cx="160" cy="140" r="8" fill="#00ff66"/>
  <circle cx="340" cy="140" r="8" fill="#00d2ff"/>
  <circle cx="140" cy="360" r="6" fill="#00d2ff"/>
  <circle cx="370" cy="360" r="6" fill="#00ff66"/>
</svg>
